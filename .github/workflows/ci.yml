name: CI                                  # steht spaeter als Ueberschrift im Reiter Actions

on:                                       # WANN
  push:
    branches: [main]                      # jeder Push auf main
  pull_request:                           # und jeder Pull Request, egal von welchem Zweig
  workflow_dispatch:                      # dazu ein Knopf zum Starten von Hand

jobs:
  pruefen:                                # Job 1, der interne Name ist frei waehlbar
    name: Lint und Tests                  # das, was du auf GitHub lesen wirst
    runs-on: ubuntu-latest                # WO, eine frische Ubuntu-Maschine von GitHub

    steps:                                # WAS, von oben nach unten
      - name: Repository holen
        uses: actions/checkout@v5         # klont dein Repo auf den Runner, sonst ist er leer

      - name: uv installieren
        uses: astral-sh/setup-uv@v6       # fertiger Baustein von den uv-Leuten
        with:
          version: "0.5.11"               # dieselbe Version wie im Dockerfile

      - name: Python bereitstellen
        run: uv python install 3.12       # der Runner bringt Python mit, aber nicht deine Version

      - name: Abhaengigkeiten installieren
        run: uv sync --frozen             # genau uv.lock, nichts aufloesen
                                          # ohne --no-dev, denn ruff und pytest braucht es hier

      - name: Formvorgaben pruefen
        run: uv run ruff check .          # Exit-Code 1 bei einem Verstoss, dann ist der Job rot

      - name: Tests laufen lassen
        run: uv run pytest -q             # 17 laufen, 3 werden uebersprungen, Korpus fehlt

  bauen:                                  # Job 2, gleiche Einrueckung wie pruefen, laeuft parallel
    name: Image bauen
    runs-on: ubuntu-latest                # eine zweite, eigene Maschine

    steps:
      - name: Repository holen
        uses: actions/checkout@v5         # auch diese Maschine ist leer und braucht den Code

      - name: Image bauen
        run: docker build -t hrpa:ci .    # der Punkt ist der Build-Kontext, wie bei dir lokal
                                          # kein push, das Image wird mit dem Runner geloescht